<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Analytics Report | Jaehyeong Hwang</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#202124;background:#f8faff}*{box-sizing:border-box}body{margin:0}.shell{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:56px 0}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h1{font-size:30px;margin:0 0 6px}p{color:#5f6368;margin:0}.auth,.panel{background:#fff;border:1px solid #dfe3e8;border-radius:14px;padding:22px;box-shadow:0 8px 24px rgba(23,78,166,.05)}.auth{display:flex;gap:10px;align-items:center;margin-bottom:20px}.auth input{flex:1;min-width:0;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.button{border:0;border-radius:8px;padding:11px 16px;background:#174ea6;color:#fff;font:600 14px inherit;cursor:pointer}.status{font-size:13px;color:#c5221f}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}.metric{font-size:32px;font-weight:700;color:#174ea6;margin-top:4px}.label{font-size:12px;color:#5f6368}.panel{margin-bottom:20px;overflow:auto}.panel h2{font-size:18px;margin:0 0 16px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #edf1f7}th{color:#5f6368;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.empty{color:#5f6368;padding:12px 0}@media(max-width:650px){.shell{padding:28px 0}.top{display:block}.auth{display:block}.auth input,.auth .button{width:100%;margin-bottom:10px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div><h1>Analytics Report</h1><p>Visitor counts and action logs for Jaehyeong Hwang’s website.</p></div></div>
    <form class="auth" id="auth-form"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token" required /><button class="button" type="submit">Load report</button><span class="status" id="status" role="status"></span></form>
    <section class="cards"><div class="panel"><div class="label">Total events</div><div class="metric" id="total-events">—</div></div><div class="panel"><div class="label">Unique IPs</div><div class="metric" id="total-visitors">—</div></div></section>
    <section class="panel"><h2>Daily activity</h2><div id="daily"><p class="empty">Enter the admin token to load data.</p></div></section>
    <section class="panel"><h2>Recent activity</h2><div id="recent"><p class="empty">Enter the admin token to load data.</p></div></section>
  </main>
  <script>
    const API = 'https://jaehyeong-analytics.ghkdwogud852.workers.dev/report';
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const formatTime = (value) => new Date(value).toLocaleString('en-US', { dateStyle:'medium', timeStyle:'medium' });
    const table = (headers, rows) => rows.length ? `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>` : '<p class="empty">No data yet.</p>';
    document.querySelector('#auth-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const token = document.querySelector('#token').value.trim();
      const status = document.querySelector('#status');
      status.textContent = 'Loading…';
      try {
        const response = await fetch(API, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) throw new Error(response.status === 401 ? 'Invalid token' : 'Unable to load report');
        const data = await response.json();
        document.querySelector('#total-events').textContent = data.totals?.events ?? 0;
        document.querySelector('#total-visitors').textContent = data.totals?.visitors ?? 0;
        document.querySelector('#daily').innerHTML = table(['Date','Events','Unique IPs'], (data.daily || []).map((row) => `<tr><td>${escapeHtml(row.day)}</td><td>${escapeHtml(row.events)}</td><td>${escapeHtml(row.visitors)}</td></tr>`));
        document.querySelector('#recent').innerHTML = table(['Time','IP','Action','Path','Target'], (data.recent || []).map((row) => `<tr><td>${escapeHtml(formatTime(row.occurred_at))}</td><td>${escapeHtml(row.ip)}</td><td>${escapeHtml(row.action)}</td><td>${escapeHtml(row.path)}</td><td>${escapeHtml(row.target || '')}</td></tr>`));
        status.style.color = '#087f5b';
        status.textContent = 'Loaded';
      } catch (error) {
        status.style.color = '#c5221f';
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
